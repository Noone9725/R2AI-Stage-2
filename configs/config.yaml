paths:
  raw: data/raw                  # kho .txt (financial_statements/<TICKER>/<YEAR>/<DOC>/<DOC>_extracted.txt)
  processed: data/processed      # CSV chuẩn hoá — nguồn cho evidence.csv_path
  index: data/index              # BM25 pickle + FAISS index + metadata.parquet
  questions: data/questions      # public_test.json / private_test.json
  outputs: outputs                 # outputs/<name>/ staging + outputs/submissions/*.zip
  labels: labels                 # nhãn tự gán để eval local

corpus:
  encoding: utf-8
  min_table_rows: 2              # khối ít hơn số dòng này không coi là bảng
  min_table_cols: 2
  keep_empty_tables: false

llm:
  # Cấu hình MẶC ĐỊNH cho GPU T4 (Colab / Kaggle 16GB) & Local GPU
  model_id: Qwen/Qwen2.5-Coder-7B-Instruct
  backend: transformers          # transformers | vllm | openai
  base_url: http://localhost:8000/v1
  max_tokens: 512                # so token sinh moi luot
  temperature: 0.0
  top_p: 1.0
  seed: 42
  dtype: auto
  quantization: awq              # awq | gptq | none (chống tràn VRAM 16GB)
  gpu_memory_utilization: 0.75
  max_model_len: 4096

llm_local:
  # Cấu hình MẶC ĐỊNH cho Local GPU RTX 2050 (4GB) / CPU
  model_id: Qwen/Qwen2.5-Coder-1.5B-Instruct
  backend: transformers
  max_tokens: 512
  temperature: 0.0
  device_map: auto
  torch_dtype: float16

execution:
  timeout_sec: 15
  max_repair_attempts: 3
  allow_imports: [pandas, numpy, math]

submission:
  # answer bắt buộc là float; None -> điền fallback để không bị "thiếu câu"
  fallback_answer: 0.0
  csv_prefix: data/              # mọi csv_path phải bắt đầu bằng đây
  round_to: 2

logging:
  level: INFO
  file: logs/app.log
